<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA Console</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{display:grid;grid-template-rows:auto 1fr auto;padding:3vh 4vw;gap:2vh}
header{display:flex;justify-content:space-between;align-items:center}
#chip{padding:10px 20px;font-weight:700;font-size:20px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
main{position:relative;min-height:0}main>section{position:absolute;inset:0}
#lobby{display:flex;align-items:center;justify-content:center;gap:8vw}
#lobby h1{font-size:clamp(36px,5vw,84px);font-weight:700;letter-spacing:-.04em;line-height:1}
#lobby p{margin-top:2vh;font-size:clamp(16px,1.6vw,26px)}#lobby b{color:var(--tx)}
#code{margin-top:4vh;font-size:clamp(56px,9vw,150px);font-weight:800;letter-spacing:.04em;font-variant-numeric:tabular-nums;text-shadow:0 0 60px rgba(139,108,255,.6)}
#qr{padding:22px;line-height:0}#qr svg{width:clamp(180px,22vw,360px);height:auto;border-radius:12px}
#menu{display:flex;flex-direction:column;justify-content:center;gap:3vh}
#menu h2{font-size:clamp(32px,4vw,64px);letter-spacing:-.03em}
#cards{display:flex;gap:2vw}
.card{flex:1;max-width:30vw;aspect-ratio:3/4;padding:2.4vw;display:flex;flex-direction:column;justify-content:flex-end;opacity:.45;transform:scale(.94);transition:.35s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 0%,var(--g),transparent 70%);opacity:.35}
.card.sel{opacity:1;transform:scale(1);border-color:rgba(255,255,255,.45);box-shadow:0 0 80px -20px var(--g)}
.card h3{font-size:clamp(20px,2.4vw,40px);position:relative}.card span{position:relative;margin-top:6px;font-size:clamp(13px,1.1vw,18px)}
.hint{color:var(--mut);font-size:clamp(13px,1.1vw,18px)}
#game #cv{width:100%;height:100%;border-radius:var(--r);background:#050505;border:1px solid var(--line)}
#gx{position:absolute;inset:0;border-radius:var(--r);overflow:hidden;background:#000;border:1px solid var(--line)}
#game .hint{position:absolute;left:24px;bottom:18px;z-index:5}
body.ingame{padding:0;gap:0;display:block}
body.ingame header,body.ingame footer{display:none}
body.ingame main>section#game{position:fixed;inset:0;z-index:20}
body.ingame #cv,body.ingame #gx{border-radius:0;border:0}
body.ingame.mod #game .hint{display:none}
#fs{position:fixed;right:14px;bottom:14px;z-index:30;padding:10px 16px;font-size:13px;color:var(--mut);opacity:0;transition:.3s;pointer-events:none}
body.ingame:not(.isfs) #fs{opacity:.85}
#dock{display:flex;gap:1.2vw;justify-content:center}
.slot{padding:12px 22px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:clamp(13px,1.2vw,20px);opacity:.35;transition:.3s}
.slot.on{opacity:1}.slot i{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c)}
.slot small{color:var(--mut);font-weight:500}
@media(max-width:800px){#lobby{flex-direction:column;gap:4vh;text-align:center}#cards{flex-direction:column}.card{max-width:none;aspect-ratio:auto}}
</style></head><body>
<header><div class="logo"><i></i>NOVA</div><div id="st" class="mut" style="font-size:14px">Connecting...</div><div id="chip" class="glass hide"></div></header>
<main>
 <section id="lobby" class="in"><div><h1>Scan to play</h1><p class="mut">Open <b id="host"></b> on your phone and enter</p><div id="code"></div></div><div id="qr" class="glass"></div></section>
 <section id="menu" class="hide"><div><h2>Choose a game</h2><p class="mut" id="who"></p></div><div id="cards"></div><p class="hint">Left and Right to browse, Cross to play</p></section>
 <section id="game" class="hide"><canvas id="cv"></canvas><div id="gx" style="display:none"></div><p class="hint">Player 1: press Select to go back</p></section>
</main>
<footer id="dock"></footer>
<div id="fs" class="glass">Click once for full screen (or press F)</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="../shared/config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../games/flappy3d.js"></script>
<script src="../games/carrom.js"></script>
<script src="../games/racing-world.js"></script>
<script src="../games/racing.js"></script>
<!-- BADMINTON: Smash Court. Order matters: core (rules/physics/AI), chars, world, then the game -->
<script src="../games/badminton-core.js"></script>
<script src="../games/badminton-chars.js"></script>
<script src="../games/badminton-world.js"></script>
<script src="../games/badminton.js"></script>
<script>
const {SUPABASE_URL,SUPABASE_ANON_KEY,MAX_PLAYERS,COLORS,GAMES}=CFG,$=id=>document.getElementById(id);
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{realtime:{params:{eventsPerSecond:60}}});
let code=sessionStorage.nova||(sessionStorage.nova=String(100000+Math.floor(Math.random()*900000)));
let players=[],mode='lobby',sel=0,game=null;const S={};
const base=location.origin+location.pathname.replace('screen/','');
$('host').textContent=location.host+location.pathname.replace('screen/','')+'controller';
const pretty=code.slice(0,3)+' '+code.slice(3);$('code').textContent=pretty;$('chip').textContent=pretty;
const qr=qrcode(0,'M');qr.addData(base+'controller/?c='+code);qr.make();$('qr').innerHTML=qr.createSvgTag({scalable:true,margin:2});
$('cards').innerHTML=GAMES.map((g,i)=>`<div class="card glass" style="--g:${COLORS[i%5]}"><h3>${g.name}</h3><span class="mut">${g.tag}</span></div>`).join('');
const ch=sb.channel('room:'+code,{config:{broadcast:{self:false}}});
const send=(e,p)=>ch.send({type:'broadcast',event:e,payload:p});
const cast=()=>send('roster',{players,mode,game,full:window.full||[]});
// ---- Game host: starts/stops games that register themselves in window.NovaGames[id] ----
const gx=$('gx'),ZERO={k:{},L:{x:0,y:0}};let live=null;
const gameCtx={get container(){return gx},get players(){return players},colors:COLORS,
 input:s=>S[s]||ZERO,send:(e,p)=>send(e,p),exit:()=>{game=null;show('menu')}};
function gameSync(){
 const want=(mode==='game'&&game&&window.NovaGames&&window.NovaGames[game])?game:null;
 $('cv').style.display=(mode==='game'&&!want)?'':'none';   // test arena for every game without a module
 gx.style.display=want?'block':'none';document.body.classList.toggle('mod',!!want);                      // must be visible BEFORE start() so it has a size
 if(live&&live!==want){try{window.NovaGames[live].stop()}catch(e){console.error(e)}live=null}
 if(want&&!live){try{window.NovaGames[want].start(gameCtx);live=want}catch(e){console.error(e);err('Game start error: '+(e&&e.message||e))}}
 if(mode==='game'&&game&&game!=='test'&&!want)err('Game file not loaded for "'+game+'"');
 if(mode==='game'&&want&&game==='flappy'&&typeof THREE==='undefined')err('three.js did not load')}
function err(m){const e=$('st');e.textContent=m;e.style.color='#ff5c8a';e.style.cssText+=';position:fixed;top:10px;left:10px;z-index:99;background:#000;padding:8px 12px;border-radius:10px;display:block'}
window.addEventListener('error',ev=>err('Error: '+ev.message+' ('+String(ev.filename||'').split('/').pop()+':'+ev.lineno+')'));
function show(m){mode=m;['lobby','menu','game'].forEach(s=>$(s).classList.toggle('hide',s!==m));$('chip').classList.toggle('hide',m==='lobby');document.body.classList.toggle('ingame',m==='game');gameSync();cast()}
function render(){
 $('dock').innerHTML=Array.from({length:MAX_PLAYERS},(_,i)=>{const p=players[i];return `<div class="slot glass ${p?'on':''}" style="--c:${COLORS[i]}"><i></i>Player ${i+1}${i===0&&p?' <small>Remote</small>':''}</div>`}).join('');
 $('who').textContent=players.length?'Player 1 is in control':'';
 [...$('cards').children].forEach((c,i)=>c.classList.toggle('sel',i===sel));
 if(players.length&&mode==='lobby')show('menu');
 if(!players.length&&mode!=='lobby')show('lobby');
}
const seen={};
function sync(){
 const now=Date.now();for(const k in seen)if(now-seen[k].last>7000)delete seen[k];
 const all=Object.values(seen).sort((a,b)=>a.t-b.t);
 const np=all.slice(0,MAX_PLAYERS).map((p,i)=>({id:p.id,slot:i}));window.full=all.slice(MAX_PLAYERS).map(p=>p.id);
 const changed=JSON.stringify(np)!==JSON.stringify(players);players=np;
 players.forEach(p=>S[p.slot]=S[p.slot]||{x:.5,y:.5,k:{},L:{x:0,y:0}});
 if(changed){render();if(live)try{window.NovaGames[live].onPlayers(players)}catch(e){console.error(e)}}cast()}
ch.on('broadcast',{event:'hello'},({payload:m})=>{if(!seen[m.id])seen[m.id]={id:m.id,t:m.t};seen[m.id].last=Date.now();sync()});
setInterval(sync,2000);
ch.on('broadcast',{event:'in'},({payload:m})=>{
 const p=players.find(p=>p.id===m.id);if(!p)return;const s=p.slot,st=S[s];
 // generic game message (carrom etc.): forward to the running game module
 if(m.t==='g'){if(mode==='game'&&live){const g=window.NovaGames[live];if(g&&g.onInput)try{g.onInput(s,m)}catch(e){console.error(e)}}return}
 if(m.t==='stick'&&m.s==='L')st.L={x:m.x,y:m.y};
 if(m.t==='btn'){st.k[m.k]=m.d;if(!m.d)return;
  // d=1 edge: hand the press to the running game so a quick tap is never missed
  if(mode==='game'&&live){const g=window.NovaGames[live];if(g&&g.onButton)try{g.onButton(s,m.k)}catch(e){console.error(e)}}
  if(s===0&&mode==='menu'){
   if(m.k==='left')sel=(sel+GAMES.length-1)%GAMES.length;
   if(m.k==='right')sel=(sel+1)%GAMES.length;
   if(m.k==='cr'||m.k==='start'){game=GAMES[sel].id;show('game')}render()}
  else if(s===0&&mode==='game'&&m.k==='select'){game=null;show('menu')}}});
ch.subscribe((s,e)=>{$('st').textContent=s==='SUBSCRIBED'?'Live':'Connection problem: '+s+(e?' '+(e.message||e):'');$('st').style.color=s==='SUBSCRIBED'?'#00e0a4':'#ff5c8a'});
// Test Arena: har player ek rang ka orb, left stick ya D-pad se chalta hai
const cv=$('cv'),cx=cv.getContext('2d');
(function loop(){requestAnimationFrame(loop);if(mode!=='game'||live)return;
 const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;cx.setTransform(d,0,0,d,0,0);
 players.forEach(p=>{const st=S[p.slot],k=st.k;
  const dx=st.L.x||((k.right?1:0)-(k.left?1:0)),dy=st.L.y||((k.down?1:0)-(k.up?1:0));
  st.x=Math.min(1,Math.max(0,st.x+dx*.008));st.y=Math.min(1,Math.max(0,st.y+dy*.008));
  const px=st.x*r.width,py=st.y*r.height,rad=k.cr?34:24,c=COLORS[p.slot];
  cx.shadowColor=c;cx.shadowBlur=30;cx.fillStyle=c;cx.beginPath();cx.arc(px,py,rad,0,7);cx.fill();
  cx.shadowBlur=0;cx.fillStyle='#fff';cx.font='600 14px system-ui';cx.textAlign='center';cx.fillText('P'+(p.slot+1),px,py+5)})})();
const de=document.documentElement,goFs=()=>{const f=de.requestFullscreen||de.webkitRequestFullscreen;if(f&&!document.fullscreenElement){const r=f.call(de);r&&r.catch&&r.catch(()=>{})}};
document.addEventListener('click',()=>{if(mode==='game')goFs()});
document.addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():goFs()}});
document.addEventListener('fullscreenchange',()=>document.body.classList.toggle('isfs',!!document.fullscreenElement));
render();
</script></body></html>
