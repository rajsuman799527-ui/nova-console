<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>NOVA Controller</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.view{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
h1{font-size:34px;letter-spacing:-.03em}p{font-size:16px}
#digits{display:flex;gap:8px}#digits input{width:46px;height:62px;text-align:center;font-size:28px;font-weight:700;color:var(--tx);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;outline:none;touch-action:manipulation;user-select:text;-webkit-user-select:text}
#digits input:focus{border-color:var(--c,var(--acc));box-shadow:0 0 24px -6px var(--acc)}
#err{color:#ff5c8a;min-height:20px}
.badge{display:flex;align-items:center;gap:10px;padding:10px 18px;font-weight:700}.badge i{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c)}
.b{display:grid;place-items:center;font-weight:700;color:var(--tx);background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid var(--line);transition:transform .08s,background .08s,box-shadow .08s;touch-action:none}
.b.on{transform:scale(.92);background:var(--c);color:#000;box-shadow:0 0 30px var(--c)}
/* remote */
#remote .dp{display:grid;grid-template-columns:repeat(3,84px);grid-template-rows:repeat(3,84px);gap:8px}
#remote .b{border-radius:22px;font-size:26px}
.ok{display:flex;gap:14px}.ok .b{width:130px;height:64px;border-radius:32px;font-size:18px}
/* pad */
#pad{position:absolute;inset:0;display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:1.1fr 1fr;padding:3vh 6vw;align-items:center;justify-items:center}
.dp3{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:min(42vh,24vw);aspect-ratio:1;gap:6px}
.dp3 .b{border-radius:18px;font-size:24px}
.face{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:min(46vh,27vw);aspect-ratio:1;gap:6px}
.face .b{border-radius:50%;font-size:32px}
.mid{display:flex;flex-direction:column;align-items:center;gap:10px;grid-column:2;grid-row:1}.mid .row{display:flex;gap:16px}
.mid{gap:16px}.mid .b{width:120px;height:46px;border-radius:23px;font-size:14px;letter-spacing:.1em}
.sticks{grid-column:1/4;grid-row:2;display:flex;gap:16vw}
.stick{width:min(38vh,21vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid var(--line);position:relative;touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:48%;height:48%;margin:-24% 0 0 -24%;border-radius:50%;background:linear-gradient(180deg,#2a2a30,#111);border:1px solid rgba(255,255,255,.2);box-shadow:0 8px 24px #000}
.stick.on{border-color:var(--c)}.stick.on .knob{border-color:var(--c);box-shadow:0 0 26px var(--c)}
#tap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;padding:24px}
#tb{position:absolute;top:calc(env(safe-area-inset-top) + 18px);left:18px}
#mn{position:absolute;top:calc(env(safe-area-inset-top) + 18px);right:18px;width:96px;height:42px;border-radius:21px;font-size:14px}
.tapbtn{width:min(78vw,58vh);aspect-ratio:1;border-radius:50%;font-size:clamp(34px,9vw,56px);letter-spacing:.02em;border:2px solid var(--c);background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--c) 35%,#000),#050505 72%);box-shadow:0 0 90px -10px var(--c),inset 0 0 60px rgba(255,255,255,.04)}
.tapbtn.on{transform:scale(.95);background:var(--c);color:#000;box-shadow:0 0 140px var(--c)}
#rot{position:absolute;inset:0;background:#000;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
@media(orientation:portrait){#pad:not(.hide)~#rot{display:flex}}
</style></head><body>
<section id="join" class="view in"><div class="logo"><i></i>NOVA</div><h1>Enter the code</h1>
<div id="digits"></div><p id="err"></p><p class="mut">Find the 6-digit code on your TV</p></section>
<section id="wait" class="view hide"><div id="wb" class="badge glass"></div><h1 id="wt"></h1><p class="mut" id="ws"></p></section>
<section id="remote" class="view hide"><div id="rb" class="badge glass"></div>
 <div class="dp"><span></span><div class="b" data-k="up">&#9650;</div><span></span><div class="b" data-k="left">&#9664;</div><span></span><div class="b" data-k="right">&#9654;</div><span></span><div class="b" data-k="down">&#9660;</div><span></span></div>
 <div class="ok"><div class="b" data-k="ci">Back</div><div class="b" data-k="cr">OK</div></div></section>
<section id="pad" class="hide">
 <div class="dp3"><span></span><div class="b" data-k="up">&#9650;</div><span></span><div class="b" data-k="left">&#9664;</div><span></span><div class="b" data-k="right">&#9654;</div><span></span><div class="b" data-k="down">&#9660;</div><span></span></div>
 <div class="mid"><div id="pb" class="badge glass"></div><div class="row"><div class="b" data-k="select">SELECT</div><div class="b" data-k="start">START</div></div></div>
 <div class="face"><span></span><div class="b" data-k="tri" style="color:#5eead4">&#9651;</div><span></span><div class="b" data-k="sq" style="color:#f9a8d4">&#9633;</div><span></span><div class="b" data-k="ci" style="color:#fca5a5">&#9675;</div><span></span><div class="b" data-k="cr" style="color:#a5b4fc">&#10005;</div><span></span></div>
 <div class="sticks"><div class="stick" data-s="L"><div class="knob"></div></div><div class="stick" data-s="R"><div class="knob"></div></div></div></section>
<section id="tap" class="hide"><div id="tb" class="badge glass"></div><div class="b" id="mn" data-k="select">Menu</div><div class="b tapbtn" data-k="cr">TAP</div><p class="mut">Tap anywhere on the circle</p></section>
<div id="rot"><div style="font-size:54px">&#8635;</div><p class="mut">Rotate your phone to play</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../shared/config.js"></script>
<script>
const {SUPABASE_URL,SUPABASE_ANON_KEY,COLORS}=CFG,$=id=>document.getElementById(id);
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{realtime:{params:{eventsPerSecond:60}}});
const id=sessionStorage.nid||(sessionStorage.nid=Math.random().toString(36).slice(2,10));
let ch=null,slot=-1,view='join';
// har game ka apna controller: 'pad' = PlayStation, 'tap' = ek bada button
const PADS={flappy:'tap'};
const show=v=>{view=v;['join','wait','remote','pad','tap'].forEach(s=>$(s).classList.toggle('hide',s!==v))};
const buzz=n=>navigator.vibrate&&navigator.vibrate(n);
// ---- code entry
const dg=$('digits');for(let i=0;i<6;i++){const e=document.createElement('input');e.inputMode='numeric';e.maxLength=1;e.autocomplete='off';dg.appendChild(e)}
const ins=[...dg.children];
ins.forEach((e,i)=>{e.oninput=()=>{e.value=e.value.replace(/\D/g,'');if(e.value&&ins[i+1])ins[i+1].focus();const c=ins.map(x=>x.value).join('');if(c.length===6)join(c)};
 e.onkeydown=k=>{if(k.key==='Backspace'&&!e.value&&ins[i-1])ins[i-1].focus()}});
const q=new URLSearchParams(location.search).get('c');
if(q&&/^\d{6}$/.test(q)){q.split('').forEach((d,i)=>ins[i].value=d);join(q)}else ins[0].focus();
function join(code){
 $('err').textContent='';if(ch)sb.removeChannel(ch);
 ch=sb.channel('room:'+code,{config:{broadcast:{self:false},presence:{key:id}}});
 let got=false;
 ch.on('broadcast',{event:'roster'},({payload:r})=>{got=true;apply(r)});
 ch.subscribe(async(s,e)=>{if(s!=='SUBSCRIBED'&&s!=='CLOSED'){$('err').textContent='Connection problem: '+s+(e?' '+(e.message||e):'')}if(s==='SUBSCRIBED'){const T=+sessionStorage.nt||(sessionStorage.nt=Date.now()),hi=()=>ch.send({type:'broadcast',event:'hello',payload:{id,t:T}});hi();clearInterval(window.hb);window.hb=setInterval(hi,2000);
  setTimeout(()=>{if(!got){$('err').textContent='No TV found. Connected to Supabase, but the TV did not answer. Refresh the TV page and use its new code.';sb.removeChannel(ch);ins.forEach(x=>x.value='');ins[0].focus();show('join')}},5000)}});
}
function badge(el){const c=COLORS[slot];el.style.setProperty('--c',c);el.innerHTML=`<i></i>Player ${slot+1}`;document.documentElement.style.setProperty('--c',c);document.documentElement.style.setProperty('--acc',c)}
function apply(r){
 slot=r.players.findIndex(p=>p.id===id);
 if(slot<0){show('wait');$('wb').innerHTML='';$('wt').textContent=r.full.includes(id)?'Room is full':'Connecting';$('ws').textContent=r.full.includes(id)?'All 5 player slots are taken.':'';return}
 if(r.mode==='game'){const g=CFG.GAMES.find(x=>x.id===r.game)||{},t=g.pad||PADS[r.game]||'pad';
  show(t);badge($(t==='tap'?'tb':'pb'));$('mn').classList.toggle('hide',slot!==0);return}
 if(slot===0){show('remote');badge($('rb'));return}
 show('wait');badge($('wb'));$('wt').textContent='You are in';$('ws').textContent=r.mode==='menu'?'Player 1 is choosing a game':'Waiting for the game to start';
}
// ---- input
const out=(o)=>ch&&ch.send({type:'broadcast',event:'in',payload:{id,...o}});
document.querySelectorAll('.b[data-k]').forEach(b=>{
 const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('on');buzz(12);out({t:'btn',k,d:1})});
 const up=()=>{if(b.classList.contains('on')){b.classList.remove('on');out({t:'btn',k,d:0})}};
 b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);
});
document.querySelectorAll('.stick').forEach(st=>{
 const kn=st.firstElementChild,s=st.dataset.s;let last=0;
 const mv=e=>{const r=st.getBoundingClientRect(),R=r.width/2;let x=(e.clientX-r.left-R)/R,y=(e.clientY-r.top-R)/R;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}
  kn.style.transform=`translate(${x*R*.5}px,${y*R*.5}px)`;const n=performance.now();if(n-last>30){last=n;out({t:'stick',s,x:+x.toFixed(2),y:+y.toFixed(2)})}};
 st.addEventListener('pointerdown',e=>{st.setPointerCapture(e.pointerId);st.classList.add('on');mv(e)});
 st.addEventListener('pointermove',e=>{if(st.classList.contains('on'))mv(e)});
 const end=()=>{st.classList.remove('on');kn.style.transform='';out({t:'stick',s,x:0,y:0})};
 st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);
});
document.addEventListener('pointerdown',()=>{if((view==='pad'||view==='tap')&&!document.fullscreenElement){const e=document.documentElement,f=e.requestFullscreen||e.webkitRequestFullscreen;
 if(f){const r=f.call(e);r&&r.catch&&r.catch(()=>{})}
 if(view==='pad'&&screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{})}},{capture:true});
document.addEventListener('contextmenu',e=>e.preventDefault());
</script></body></html>
